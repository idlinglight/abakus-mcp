name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # adds -eo pipefail; the default macOS run shell omits pipefail

jobs:
  build-and-test: # the required check name in the ruleset is this job id
    runs-on: xcode-27 # public preview, arm64, Xcode 27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
